<style>
	@page { size: A4; margin: 14mm 12mm; }
	* { box-sizing: border-box; }
	body { font-family: "Cairo", "Noto Naskh Arabic", "Noto Sans Arabic", "DejaVu Sans", Tahoma, Arial, sans-serif; color: #1b2942; font-size: 12px; line-height: 1.7; margin: 0; padding: 0; direction: {{ dir }}; text-align: {{ 'right' if dir == 'rtl' else 'left' }}; }
	h1 { font-size: 20px; margin: 0 0 4px; }
	h2 { font-size: 15px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #d9e0ec; }
	h3 { font-size: 13px; margin: 0 0 4px; }
	.muted { color: #6a778d; }
	.head { border-bottom: 2px solid #192f56; padding-bottom: 10px; margin-bottom: 14px; }
	.brand { font-weight: 700; color: #192f56; letter-spacing: 0.5px; }
	table { width: 100%; border-collapse: collapse; }
	th, td { border: 1px solid #dde4ef; padding: 5px 8px; vertical-align: top; }
	th { background: #f4f7fc; font-weight: 700; font-size: 11px; }
	.kv td:first-child { width: 28%; background: #f8faff; font-weight: 700; }
	.situation { border: 1px solid #cfdaf6; background: #f4f7ff; border-radius: 6px; padding: 10px 14px; font-weight: 700; font-size: 13px; }
	.event { border: 1px solid #dde4ef; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; page-break-inside: avoid; }
	.event.superseded { background: #fafafa; color: #7b8698; }
	.event.superseded h3 { text-decoration: line-through; }
	.tag { display: inline-block; border: 1px solid #cfd8e8; border-radius: 10px; padding: 0 8px; font-size: 10px; color: #4a5871; margin-{{ 'left' if dir == 'rtl' else 'right' }}: 4px; }
	.doc { font-size: 11px; color: #3b57a0; }
	.land-break { page-break-before: always; }
	.footer { margin-top: 24px; font-size: 10px; color: #8a96aa; border-top: 1px solid #e3e8f1; padding-top: 6px; }
</style>
