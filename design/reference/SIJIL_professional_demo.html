function openModal(kind){if(kind==='newFolder'){const parent=db.folders.find(f=>f.id===activeFolder);modal('إنشاء مجلد جديد',`${field('اسم المجلد','name','','text','required')}<div class="field"><label>الموقع</label><select name="parentId"><option value="">جذر المكتبة</option>${db.folders.map(f=>`<option value="${esc(f.id)}" ${f.id===activeFolder?'selected':''}>${esc(folderPath(f.id).map(x=>x.name).join(' / '))}</option>`).join('')}</select></div>`,f=>{const pid=f.get('parentId')||null,root=pid?db.folders.find(x=>x.id===pid):null;const name=f.get('name').trim();if(!name)return;const id='folder_'+Date.now();db.folders.push({id,name,parentId:pid,landId:root?.landId||null});activeFolder=id;save();close();render();toast('تم إنشاء المجلد')})}else if(kind==='newDoc'){const folderOptions=db.folders.map(f=>[f.id,folderPath(f.id).map(x=>x.name).join(' / ')]);const selected=db.folders.find(f=>f.id===activeFolder)||db.folders.find(f=>f.landId===(page==='case'?ca(caseId)?.landId:landId)&&f.name==='المخططات والدراسات');modal('إضافة مستند إلى المكتبة',`<div class="notice">محاكاة: حفظ اسم الملف وتصنيفه فقط، وليس محتوى PDF الحقيقي.</div>${field('اسم المستند','name','','text','required')}${field('تصنيف المستند','kind','مستند')}${opts('folderId',folderOptions,selected?.id||folderOptions[0]?.[0])}`,f=>{const folder=db.folders.find(x=>x.id===f.get('folderId'));if(!folder?.landId){toast('اختر مجلدًا داخل إحدى الأراضي');return}db.documents.push({id:'d'+Date.now(),landId:folder.landId,folderId:folder.id,name:f.get('name'),kind:f.get('kind'),date:today});save();close();render();toast('تمت إضافة المستند إلى المجلد')})}else if(kind==='newTask'){taskModal(null)}else legacyOpenModal(kind)}
function taskModal(t){const current=t||{},defaultLand=page==='case'?ca(caseId)?.landId:page==='land'?landId:'l1';modal(t?'تعديل المهمة':'إنشاء مهمة جديدة',`${field('عنوان المهمة','title',current.title||'','text','required')}<div class="field"><label>الأرض / المشروع</label><select name="landId" id="taskland">${db.lands.map(l=>`<option value="${esc(l.id)}" ${l.id===(current.landId||defaultLand)?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>ربط بمعاملة (اختياري)</label><select name="caseId" id="taskcase"><option value="">مهمة عامة للأرض</option>${db.cases.filter(c=>c.landId===(current.landId||defaultLand)).map(c=>`<option value="${esc(c.id)}" ${c.id===(current.caseId||(page==='case'?caseId:''))?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="grid2">${field('المسؤول','owner',current.owner||'م. أحمد','text','required')}${field('الموعد','date',current.date||'2026-10-27','date','required')}</div><div class="field"><label>الأولوية</label><select name="priority">${['منخفضة','متوسطة','عالية'].map(x=>`<option ${x===(current.priority||'متوسطة')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>تفاصيل المهمة</label><textarea name="details">${esc(current.details||'')}</textarea></div>`,f=>{const payload={title:f.get('title'),landId:f.get('landId'),caseId:f.get('caseId'),owner:f.get('owner'),date:f.get('date'),priority:f.get('priority'),details:f.get('details')};if(t)Object.assign(t,payload);else db.tasks.push({id:'t'+Date.now(),...payload,status:'مفتوحة'});save();close();render();toast(t?'تم تحديث المهمة':'تم إنشاء المهمة')},t?'حفظ التعديلات':'إنشاء المهمة');document.getElementById('taskland').onchange=e=>{document.getElementById('taskcase').innerHTML='<option value="">مهمة عامة للأرض</option>'+db.cases.filter(c=>c.landId===e.target.value).map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')}}
function followResult(id){const f=db.followups.find(x=>x.id===id);if(!f)return;const c=ca(f.caseId);modal('تسجيل نتيجة المتابعة',`<div class="notice">${esc(land(c.landId)?.name)} / ${esc(c.title)}<div style="margin-top:7px">المتابعة: ${esc(f.title)}</div></div>${field('عنوان ما حدث','title','نتيجة متابعة: '+f.title,'text','required')}${field('تاريخ المتابعة','date',today,'date','required')}<div class="field"><label>ماذا حدث فعليًا؟</label><textarea name="body" required placeholder="ما الذي قاله المكتب؟ وما نتيجة المتابعة؟"></textarea></div><div class="field"><label>تحديث الموقف الحالي (اختياري)</label><textarea name="current" placeholder="الموقف الذي سيظهر للإدارة"></textarea></div>${opts('docId',[['','بدون مستند'],...db.documents.filter(d=>d.landId===c.landId).map(d=>[d.id,d.name])],'')}<label class="checklabel"><input name="newFollow" type="checkbox" id="newFollowResult"> تحديد متابعة جديدة</label><div id="nextFollowFields" class="nested" style="display:none">${field('المتابعة التالية','nextTitle','')}<div class="grid2">${field('المسؤول','nextOwner',f.owner)}${field('التاريخ','nextDate','2026-10-27','date')}</div></div>`,data=>{const eid='e'+Date.now(),d=data.get('docId');db.events.push({id:eid,caseId:c.id,date:data.get('date'),title:data.get('title'),body:data.get('body'),author:'م. أحمد',docIds:d?[d]:[]});c.last=data.get('date');if(data.get('current')?.trim())c.current=data.get('current').trim();f.status='مكتملة';f.completedAt=today;if(data.get('newFollow'))db.followups.push({id:'f'+(Date.now()+1),caseId:c.id,title:data.get('nextTitle')||'متابعة جديدة',owner:data.get('nextOwner')||f.owner,date:data.get('nextDate')||today,status:'مفتوحة',sourceEventId:eid});save();close();go('case',c.id);toast('تم توثيق نتيجة المتابعة وحفظها في تاريخ المعاملة')},'حفظ النتيجة');document.getElementById('newFollowResult').onchange=e=>document.getElementById('nextFollowFields').style.display=e.target.checked?'block':'none'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-folder],[data-followfilter],[data-taskfilter],[data-tasktoggle],[data-edittask],[data-resultfollow]');if(!t)return;if(t.dataset.folder){folderSelect(t.dataset.folder==='__all'?null:t.dataset.folder)}else if(t.dataset.followfilter){followFilter=t.dataset.followfilter;render()}else if(t.dataset.taskfilter){taskFilter=t.dataset.taskfilter;render()}else if(t.dataset.tasktoggle){const x=db.tasks.find(t=>t.id===t.dataset.tasktoggle);x.status=x.status==='مكتملة'?'مفتوحة':'مكتملة';save();render();toast('تم تحديث حالة المهمة')}else if(t.dataset.edittask){taskModal(db.tasks.find(x=>x.id===t.dataset.edittask))}else if(t.dataset.resultfollow){followResult(t.dataset.resultfollow)}});

document.addEventListener('click',e=>{let t=e.target.closest('[data-go],[data-land],[data-case],[data-open],[data-tab],[data-dismiss],[data-print],[data-docinfo],[data-closefollow]');if(!t){if(e.target.id==='shade')close();return}if(t.dataset.go)go(t.dataset.go);else if(t.dataset.land)go('land',t.dataset.land);else if(t.dataset.case)go('case',t.dataset.case);else if(t.dataset.open)openModal(t.dataset.open);else if(t.dataset.tab){caseTab=t.dataset.tab;render()}else if(t.dataset.dismiss)close();else if(t.dataset.print){caseTab='history';render();window.print()}else if(t.dataset.docinfo){const d=db.documents.find(d=>d.id===t.dataset.docinfo);const used=db.events.filter(e=>e.docIds.includes(d.id));modal('تفاصيل المستند',`<div class="notice">مستند تجريبي — لا يوجد ملف PDF مرفوع فعليًا.</div><h3>${esc(d.name)}</h3><p>التصنيف: ${esc(d.kind)}</p><p>الأرض: ${esc(land(d.landId)?.name)}</p><p>تاريخ الإضافة: ${date(d.date)}</p><h4>مرتبط بالأحداث التالية:</h4>${used.map(e=>`<p>• ${esc(e.title)} — ${esc(ca(e.caseId)?.title)} (${date(e.date)})</p>`).join('')||'<p class="muted">غير مرتبط بحدث بعد</p>'}`,()=>close(),'إغلاق')}else if(t.dataset.closefollow){let f=db.followups.find(f=>f.id===t.dataset.closefollow);f.status='مكتملة';save();render();toast('تم إغلاق المتابعة — سجّل تطورًا لتوثيق ما حدث')}});document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){query=e.target.value.trim();go('allcases')}});document.getElementById('notify').onclick=()=>go('followups');render();
</script></body></html>
